# Production container for sunoracomponents.eu.
# On the server it lives in ~/sites/sunora, next to the other sites and
# the proxy. Start or update: docker compose up -d --build
#
# The server's nginx-proxy routes the domain to this container by the
# VIRTUAL_HOST variables below, and acme-companion issues the Let's Encrypt
# certificate for LETSENCRYPT_HOST. No ports are published.

name: sunora

services:
  site:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://sunoracomponents.eu}
        NEXT_PUBLIC_FORM_ENDPOINT: ${FORM_ENDPOINT:-}
    image: sunora-site:latest
    container_name: sunora-site
    restart: always
    environment:
      VIRTUAL_HOST: sunoracomponents.eu,www.sunoracomponents.eu
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: sunoracomponents.eu,www.sunoracomponents.eu
    networks:
      - webproxy

networks:
  # Created by ~/sites/proxy/docker-compose.yml.
  webproxy:
    name: webproxy
    external: true
