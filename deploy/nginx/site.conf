# nginx inside the site container. TLS is handled by the server's
# nginx-proxy, which forwards both sunoracomponents.eu and www here.

# One address for search engines: www goes to the bare domain.
server {
    listen 80;
    server_name www.sunoracomponents.eu;
    return 301 https://sunoracomponents.eu$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects stay relative, so they keep the public host and https
    # that the reverse proxy is serving.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # One language for now: send the bare domain straight to it.
    location = / {
        return 301 /en/;
    }

    # File names carry a content hash, so they never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # Pages are exported as <route>/index.html (trailingSlash: true).
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
